<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launching St Joseph's University</title>
    
    <meta http-equiv="refresh" content="10;url=index.php">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #f8f9fa; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            overflow: hidden;
        }

        /* --- THE CURTAINS --- */
        .curtain {
            position: absolute; top: 0; width: 50%; height: 100%; 
            background: #0f204b; 
            z-index: 20;
            transition: transform 2s cubic-bezier(0.7, 0, 0.3, 1) 0.8s;
        }
        .curtain.left { left: 0; border-right: 3px solid #ffc107; }
        .curtain.right { right: 0; border-left: 3px solid #ffc107; }

        /* --- THE RIBBON --- */
        .ribbon-container {
            position: absolute; top: 50%; width: 100%; height: 80px; 
            z-index: 30; transform: translateY(-50%);
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.5s ease 0.3s;
        }
        .ribbon {
            width: 100%; height: 60px; background: #dc3545; 
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            color: white; font-weight: bold; font-size: 24px; letter-spacing: 4px; text-transform: uppercase;
        }

        /* --- ANIMATION TRIGGERS --- */
        body.launch .ribbon-container { opacity: 0; pointer-events: none; }
        body.launch .curtain.left { transform: translateX(-100%); }
        body.launch .curtain.right { transform: translateX(100%); }

        /* --- MAIN CONTENT --- */
        .content-wrapper {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; z-index: 5; width: 100%; padding: 20px;
        }
        .sju-title {
            font-family: 'Playfair Display', serif; font-size: 3.5rem; 
            color: #0f204b; font-weight: bold; margin-bottom: 10px;
        }
        
        .timer-circle {
            width: 150px; height: 150px; border-radius: 50%; 
            border: 6px solid #ffc107; 
            display: flex; justify-content: center; align-items: center;
            font-size: 60px; font-weight: bold; margin: 30px auto; 
            color: #0f204b; background: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="curtain left"></div>
    <div class="curtain right"></div>
    
    <div class="ribbon-container">
        <div class="ribbon">Inauguration</div>
    </div>

    <div class="content-wrapper">
        <h1 class="sju-title">St Joseph's University</h1>
        <h3 class="text-secondary fw-light">The new digital campus is going live</h3>
        
        <div class="timer-circle" id="countdown">10</div>
        
        <p class="text-muted fw-bold mt-3 text-uppercase tracking-wide">Redirecting to Homepage...</p>
    </div>

    <script>
        window.onload = function() {
            // Trigger the CSS animation
            setTimeout(() => {
                document.body.classList.add('launch');
            }, 600);

            // Handle the visual countdown (Meta tag handles the actual redirect)
            let timeLeft = 10;
            const timerElement = document.getElementById('countdown');
            
            setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    timerElement.textContent = timeLeft;
                }
            }, 1000);
        };
    </script>
</body>
</html>
