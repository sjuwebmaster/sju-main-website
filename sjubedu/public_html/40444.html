<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | St Joseph's University</title>
    <link rel="icon" type="image/webp" href="https://sju.edu.in/images/logo.webp">
    
    <style>
        :root {
            --sju-blue: #004a99;
            --sju-dark: #002d5e;
            --bg-gray: #f4f7f9;
        }

        body {
            background-color: var(--bg-gray);
            color: #333;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #ffffff;
            padding: 60px 40px;
            border-radius: 4px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
            width: 90%;
            border-top: 8px solid var(--sju-blue);
            animation: fadeIn 1.2s ease-out;
        }

        .logo {
            max-width: 150px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 64px;
            color: var(--sju-dark);
            margin: 0;
            font-weight: 800;
            line-height: 1;
        }

        h2 {
            font-size: 24px;
            color: var(--sju-blue);
            margin: 10px 0 20px 0;
        }

        .divider {
            height: 2px;
            width: 60px;
            background: var(--sju-blue);
            margin: 20px auto;
        }

        p {
            line-height: 1.8;
            color: #555;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .info-box {
            background: #fff5f5;
            border: 1px dashed #e53e3e;
            padding: 15px;
            font-size: 0.9rem;
            color: #c53030;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            background: var(--sju-blue);
            color: #ffffff;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background: var(--sju-dark);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .footer {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #999;
        }
    </style>
</head>
<body>\<!---

    <div class="container">
        <img src="https://sju.edu.in/images/logo.webp" alt="SJU Logo" class="logo">
        
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <div class="divider"></div>
        
        <p>The resource you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>

        <div class="info-box">
            Error: HTTP 404 - File Not Found
        </div>

        <a href="/" class="btn">Return to Homepage</a>

        <div class="footer">
            &copy; 2026 St Joseph's University. <br>
            If you believe this is a technical error, please contact IT Support.
        </div>
    </div>

</body>
</html>
