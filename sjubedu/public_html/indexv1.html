<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain Reserved | St Joseph's University</title>
    <link rel="icon" type="image/webp" href="https://sjub.s3.ap-south-1.amazonaws.com/Assets/logo.webp">
    
    <style>
        :root {
            --sju-blue: #004a99;
            --sju-dark: #002d5e;
            --bg-gray: #f4f7f9;
        }

        body {
            background-color: var(--bg-gray);
            color: #333;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #ffffff;
            padding: 60px 40px;
            border-radius: 4px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
            width: 90%;
            border-top: 8px solid var(--sju-blue);
            animation: fadeIn 1.2s ease-out;
        }

        /* Logo Animation */
        .logo {
            max-width: 180px;
            margin-bottom: 20px;
            animation: pulse 3s infinite ease-in-out;
        }

        h1 {
            font-size: 32px;
            color: var(--sju-dark);
            margin: 10px 0 20px 0;
            font-weight: 700;
        }

        .divider {
            height: 2px;
            width: 60px;
            background: var(--sju-blue);
            margin: 20px auto;
        }

        p {
            line-height: 1.8;
            color: #555;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .info-box {
            background: #fdfdfd;
            border: 1px dashed #ccd6dd;
            padding: 15px;
            font-size: 0.9rem;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.03); opacity: 0.9; }
            100% { transform: scale(1); opacity: 1; }
        }

        .footer {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://sju.edu.in/images/logo.webp" alt="SJU Logo" class="logo">
        
        <h1>Domain Reserved</h1>
        <div class="divider"></div>
        
        <p>This domain is officially registered to <strong>St Joseph's University (sju.edu.in)</strong></p>

        <div class="info-box">
            Status: Institutional Resource
        </div>

        <div class="footer">
            &copy; 2026 St Joseph's University. All rights reserved. <br>
            Managed by the University IT Department
        </div>
    </div>

</body>
</html>
